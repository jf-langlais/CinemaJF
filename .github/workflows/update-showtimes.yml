name: Refresh cinema showtimes

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_showtimes.py'
      - 'requirements.txt'
      - '.github/workflows/update-showtimes.yml'

permissions:
  contents: write

concurrency:
  group: cinema-showtimes-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium for fallback rendering
        run: python -m playwright install --with-deps chromium
      - name: Refresh next 7 days
        run: python scripts/update_showtimes.py
      - name: Commit refreshed data
        run: |
          git config user.name "CinemaJF Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data metadata.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh cinema showtimes"
            git push
          fi